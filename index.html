<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0a0b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TREASURE">
<title>TREASURE</title>
<style>
:root{
  --bg:#0e0a0b; --card:#171112; --ink:#f5eff0; --mute:#a99da0; --line:#2b2224;
  --red:#c4182b; --on-red:#ffffff; --bubble-in:#262022; --shadow:none;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
[hidden]{display:none!important}

.app{height:100dvh;max-width:720px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);
  padding-top:env(safe-area-inset-top,0px);border-inline:1px solid transparent}
@media(min-width:760px){.app{border-inline-color:var(--line)}}
.top{display:flex;align-items:center;gap:10px;padding:12px max(16px,env(safe-area-inset-left,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:linear-gradient(180deg,#2c0c12 0%,var(--card) 100%);min-height:56px}
.top h1{margin:0;font-size:18px;font-weight:700;flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.brand{color:var(--red);letter-spacing:.22em;font-weight:800}
.main{flex:1;overflow:auto;padding:12px max(16px,env(safe-area-inset-left,0px)) 96px;-webkit-overflow-scrolling:touch}
.nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;background:none;border:0;padding:8px 0 7px;font-size:11px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.nav button.on{color:#fff;font-weight:700}
.nav button.on svg{color:var(--red);filter:drop-shadow(0 0 6px rgba(196,24,43,.65))}

.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;box-shadow:var(--shadow)}
button.row:active{background:var(--bg)}
.g{flex:1;min-width:0}
.tr{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b{font-weight:600}
.m{color:var(--mute);font-size:13px}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#c4182b,#6e0b17);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.badge{background:var(--red);color:var(--on-red);border-radius:99px;font-size:11px;font-weight:700;padding:1px 7px;min-width:20px;text-align:center}

.btn{background:var(--red);color:var(--on-red);border:0;border-radius:10px;padding:10px 16px;font-weight:600}
.btn.o{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.s{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.55}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 13px;margin:0 6px 8px 0;font-size:13px}
.chip.on{background:var(--red);color:#fff;border-color:var(--red)}
.chip.ic{padding:6px 10px}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
label.f{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
.form{display:grid;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.empty{color:var(--mute);text-align:center;padding:36px 12px}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;border:0;background:var(--red);color:var(--on-red);font-size:28px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.28)}
@media(min-width:760px){.fab{right:calc(50% - 340px)}}

.msgs{flex:1;overflow:auto;padding:10px max(14px,env(safe-area-inset-left,0px)) 10px;display:flex;flex-direction:column;gap:2px}
.sep{align-self:center;color:var(--mute);font-size:12px;margin:10px 0 6px}
.bub{max-width:80%;padding:7px 11px;border-radius:14px;background:var(--bubble-in);border:1px solid var(--line);align-self:flex-start;overflow-wrap:anywhere}
.bub .txt{white-space:pre-wrap}
.bub.me{align-self:flex-end;background:linear-gradient(135deg,#9a1022,#6e0b17);color:var(--on-red);border-color:#8f0f1e}
.bub .who{font-size:12px;font-weight:700;color:var(--red);margin-bottom:1px}
.bub .meta{font-size:11px;opacity:.7;margin-top:2px;display:flex;gap:8px;white-space:normal}
.bub .meta button{background:none;border:0;padding:0;color:inherit;text-decoration:underline;font-size:11px}
.composer{display:flex;gap:8px;padding:10px max(12px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--card)}
.composer input{flex:1;min-width:0}
.ib{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--ink);padding:0;cursor:pointer}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rec{display:flex;align-items:center;gap:10px;padding:10px max(12px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--card)}
.rec .dot{width:10px;height:10px;border-radius:50%;background:var(--red);animation:blink 1s infinite}
.rec .g{font-weight:600}
@keyframes blink{50%{opacity:.25}}
.bub img{display:block;max-width:100%;max-height:340px;border-radius:10px;margin:2px 0}
.bub video{display:block;max-width:100%;max-height:340px;border-radius:10px}
.bub audio{display:block;width:230px;max-width:100%}
.bub a.file{color:inherit;text-decoration:underline;display:block;padding:2px 0}

.auth{min-height:100dvh;display:grid;place-items:center;padding:24px max(20px,env(safe-area-inset-left,0px));background:radial-gradient(120% 80% at 50% 0%,#7d0c19 0%,#2a0a0f 55%,#0e0a0b 100%);color:#fff}
.auth .box{width:100%;max-width:380px}
.auth h1{font-size:36px;letter-spacing:.25em;margin:0 0 4px;color:#fff;font-weight:800}
.auth .tag{letter-spacing:.2em;font-size:12px;opacity:.8;margin:0 0 22px}
.auth input{background:rgba(0,0,0,.35);border-color:#5a2029;color:#fff;margin-bottom:10px}
.auth .err{color:#ffb4ab;min-height:20px;font-size:14px;margin:2px 0 8px}
.auth .ok{color:#b8f0c8}
.auth .btn{width:100%;padding:12px}
.auth .link{background:none;border:0;color:#fff;text-decoration:underline;margin-top:14px;width:100%;padding:8px}

.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);border-radius:16px 16px 0 0;width:100%;max-width:720px;max-height:86dvh;display:flex;flex-direction:column;padding:14px max(16px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px))}
.sheet .list{overflow:auto;flex:1;margin:10px 0}
.sheet .row{box-shadow:none}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#2a1014;border:1px solid #5a1a24;color:#fff;padding:9px 16px;border-radius:99px;z-index:50;max-width:90%;font-size:14px;text-align:center}
.tg{width:44px;height:26px;border-radius:99px;background:var(--line);border:0;position:relative;flex:none;padding:0}
.tg:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.tg.on{background:var(--red)}.tg.on:after{left:21px}
h2{font-size:15px;margin:20px 0 8px}
.auth .fine{font-size:12px;opacity:.8;text-align:center;margin:14px 0 0}
.auth .fine button{background:none;border:0;color:#fff;text-decoration:underline;padding:0;font-size:12px}
.legal h2{font-size:15px;margin:16px 0 4px}.legal p{margin:0;color:var(--mute)}
.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.lg{width:84px;height:84px;font-size:32px;margin:0 auto 8px}
.search{margin-bottom:10px}
.chatbar{padding:8px max(14px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--card)}
.tabbadge{display:inline-block;margin-left:6px;vertical-align:middle}
.danger{color:#c4202d;border-color:#c4202d}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.logo{display:block;object-fit:contain}
.auth .logo{margin:0 auto 14px;width:84px;height:auto}
.auth h1,.auth .tag{text-align:center}
.top .g h1{display:block;font-size:17px;flex:none}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px;padding-bottom:2px;scrollbar-width:none}
.chips .chip{margin:0;white-space:nowrap;flex:none}
.search{border-radius:99px;padding-left:16px}
.ib.sm{width:38px;height:38px}
.ib.dim{opacity:.45}
.ib.send{background:linear-gradient(135deg,#d11f33,#8f0f1e);border:0;color:#fff}
.fab svg{width:26px;height:26px;stroke-width:2.2}
.fab{background:linear-gradient(135deg,#d11f33,#8f0f1e);display:grid;place-items:center}
.row{border-radius:14px}
.un{color:var(--ink);font-weight:600}
.av.md{width:56px;height:56px;font-size:22px}
.ring{padding:3px;border-radius:50%;border:2px solid var(--line);flex:none}
.ring.new{border-color:var(--red)}
.ring .av{width:44px;height:44px}
.nav .navbadge{position:absolute;top:3px;left:calc(50% + 6px);font-size:10px;padding:0 5px;min-width:16px}
.emo{border-top:1px solid var(--line);background:var(--card);max-height:210px;overflow:auto;padding:4px max(12px,env(safe-area-inset-left,0px)) 8px}
.emo h3{font-size:12px;color:var(--mute);margin:8px 0 4px;font-weight:600;letter-spacing:.04em}
.emo .eg{display:flex;flex-wrap:wrap;gap:2px}
.emo button{background:none;border:0;font-size:25px;line-height:1;padding:5px;border-radius:8px}
.bub{position:relative}
.rxs,.tgs{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.rx{background:rgba(255,255,255,.12);border:1px solid transparent;border-radius:99px;padding:1px 8px;font-size:13px;color:inherit}
.rx.on{border-color:rgba(255,255,255,.45)}
.tagc{font-size:11px;border:1px solid currentColor;border-radius:99px;padding:0 7px;opacity:.85}
.bub .meta .mm{margin-left:auto;text-decoration:none;font-size:16px;line-height:1;padding:0 2px}
.qr{display:flex;justify-content:space-between;gap:6px}
.qb{flex:1;font-size:24px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 0}
.qb.on{border-color:var(--red);background:#2a0d12}
.mact{margin-top:10px}.mact .row{margin-bottom:6px}
.cbrow{display:flex;gap:8px;align-items:center}.cbrow input{flex:1}
.tsprev{border-radius:16px;min-height:200px;display:grid;place-items:center;padding:16px}
.tsprev textarea{background:transparent;border:0;color:#fff;font-size:22px;font-weight:600;text-align:center;resize:none;width:100%}
.tsprev textarea::placeholder{color:rgba(255,255,255,.6)}
.sw{display:flex;gap:10px;margin:12px 0}
.swatch{width:34px;height:34px;border-radius:50%;border:2px solid transparent;padding:0}
.swatch.on{border-color:#fff;outline:2px solid var(--red)}
.sv{position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column;color:#fff;padding-top:env(safe-area-inset-top,0px)}
.svbars{display:flex;gap:4px;padding:8px 12px 4px}
.svbars i{flex:1;height:3px;background:rgba(255,255,255,.3);border-radius:2px;overflow:hidden;position:relative}
.svbars i.d{background:#fff}
.svbars i.c:after{content:"";position:absolute;inset:0;background:#fff;transform-origin:left;animation:svp 5s linear forwards}
@keyframes svp{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.svhead{display:flex;align-items:center;gap:10px;padding:6px 12px;position:relative;z-index:3}
.svhead .ib{background:rgba(0,0,0,.4);border-color:rgba(255,255,255,.25);color:#fff}
.svbody{flex:1;display:grid;place-items:center;overflow:hidden;position:relative}
.svbody img{max-width:100%;max-height:100%;object-fit:contain}
.svtxt{font-size:28px;font-weight:700;text-align:center;padding:24px;white-space:pre-wrap;overflow-wrap:anywhere}
.svcap{padding:12px 16px;text-align:center;background:rgba(0,0,0,.55);position:relative;z-index:3}
.svviews{padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));text-align:center;font-size:13px;position:relative;z-index:3}
.svnav{position:absolute;top:84px;bottom:70px;width:40%;background:none;border:0;z-index:2}
.svnav.l{left:0}.svnav.r{right:0}
.bub{touch-action:pan-y}
.quote{display:block;border-left:3px solid #fff;background:rgba(0,0,0,.22);border-radius:8px;padding:4px 8px;margin-bottom:4px;font-size:13px;cursor:pointer;text-align:left}
.bub:not(.me) .quote{border-left-color:var(--red)}
.quote b{display:block;font-size:12px}.quote span{display:block;opacity:.85;max-width:240px}
.flash{animation:fl 1.1s}
@keyframes fl{0%,60%{box-shadow:0 0 0 3px var(--red)}100%{box-shadow:none}}
.rbar{display:flex;align-items:center;gap:8px;padding:8px max(14px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);border-left:4px solid var(--red);background:var(--card)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

  const y = new Date(n.getTime() - 864e5);

function makeIcon(size) {

    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas"); c.width = c.height = size;
      const g = c.getContext("2d");
      g.fillStyle = "#b3121f"; g.fillRect(0, 0, size, size);
      const h = size * 0.58, w = h * img.width / img.height;
      g.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
      res(c.toDataURL("image/png"));

    img.onerror = () => res("");
    img.src = LOGO;
  });
}

function squarePhoto(file, size) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const s = Math.min(img.width, img.height), sx = (img.width - s) / 2, sy = (img.height - s) / 2;
      const c = document.createElement("canvas"); c.width = c.height = size;
      c.getContext("2d").drawImage(img, sx, sy, s, s, 0, 0, size, size);
      res(c.toDataURL("image/jpeg", 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Could not read that image.")); };
    img.src = url;
  });
}

async function refreshConvs() {

    .select("conversation_id,last_read_at,conversations(id,is_group,title,created_at)").eq("user_id", S.user.id);
  if (error) { toast(error.message); return; }
  const ids = mem.map(m => m.conversation_id);
  if (!ids.length) { S.convs = []; paintConvs(); return; }
  const [a, b, c] = await Promise.all([
    sb.from("conversation_members").select("conversation_id,user_id,profiles(display_name,avatar_url)").in("conversation_id", ids),
    sb.from("messages").select("id,conversation_id,sender_id,body,media_type,created_at,deleted_at").in("conversation_id", ids).order("created_at", {ascending: false}).limit(300),
    sb.rpc("unread_counts")
  ]);
  const members = a.data || [], msgs = b.data || [], unread = {};
  (c.data || []).forEach(r => { unread[r.conversation_id] = Number(r.unread) || 0; });
  members.forEach(r => { if (r.profiles) { S.names[r.user_id] = r.profiles.display_name; S.avatars[r.user_id] = r.profiles.avatar_url || null; } });
  const lastBy = {};

    const title = cv.is_group ? (cv.title || "Group") : ((others[0] && S.names[others[0].user_id]) || "Chat");

  }).sort((x, y) => new Date(y.time) - new Date(x.time));

/* ---------- PHOTOS, FILES, VOICE NOTES ---------- */
const URLS = {};
const mediaLabel = t => t === "image" ? "Photo" : t === "voice" ? "Voice note" : t === "video" ? "Video" : "File";
async function signedUrls(paths) {
  const need = paths.filter(p => !URLS[p] || URLS[p].exp < Date.now() + 60000);
  if (!need.length) return;
  const {data, error} = await sb.storage.from("chat-media").createSignedUrls(need, 3600);
  if (error || !data) return;
  data.forEach(r => { if (r.signedUrl && r.path) URLS[r.path] = {url: r.signedUrl, exp: Date.now() + 3600e3}; });
}
function mediaHtml(m) {
  if (!m.media_path || m.deleted_at) return "";
  const p = esc(m.media_path), u = (URLS[m.media_path] || {}).url, src = u ? ` src="${esc(u)}"` : "", href = u ? ` href="${esc(u)}"` : "";
  if (m.media_type === "image") return `<a data-path="${p}"${href} target="_blank" rel="noopener"><img data-path="${p}"${src} alt="Photo"></a>`;
  if (m.media_type === "voice") return `<audio controls preload="none" data-path="${p}"${src}></audio>`;
  if (m.media_type === "video") return `<video controls playsinline preload="metadata" data-path="${p}"${src}></video>`;
  const name = esc(m.media_path.split("/").pop().replace(/^\d+-/, ""));
  return `<a class="file" data-path="${p}"${href} target="_blank" rel="noopener">Open file: ${name}</a>`;
}
async function hydrateMedia() {
  const els = [...document.querySelectorAll("#msgs [data-path]")];
  if (!els.length) return;
  await signedUrls([...new Set(els.map(e => e.dataset.path))]);
  els.forEach(e => {
    const u = URLS[e.dataset.path]; if (!u) return;
    if (e.tagName === "A") { if (!e.getAttribute("href")) e.href = u.url; return; }
    if (!e.getAttribute("src")) {
      if (e.tagName === "IMG") e.addEventListener("load", () => { const box = $("#msgs"); if (box && S.stick) box.scrollTop = box.scrollHeight; }, {once: true});
      e.src = u.url;
    }
  });
}
function compressImage(file, max, quality) {
  max = max || 1280; quality = quality || 0.8;
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const k = Math.min(1, max / Math.max(img.width, img.height)), w = Math.round(img.width * k), h = Math.round(img.height * k);
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      c.toBlob(b => b ? res(b) : rej(new Error("compress failed")), "image/jpeg", quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("image load failed")); };
    img.src = url;
  });
}
async function sendFile(file) {
  if (!file || !S.open) return false;
  if (file.size > 25 * 1024 * 1024) { toast("That file is too large. The limit is 25 MB."); return false; }
  const kind = (file.type || "").split("/")[0];
  const type = kind === "image" ? "image" : kind === "video" ? "video" : kind === "audio" ? "voice" : "document";
  let blob = file, name = file.name || "file";
  toast("Sending…");
  if (type === "image" && file.type !== "image/gif") {
    try { blob = await compressImage(file); name = name.replace(/\.[^.]+$/, "") + ".jpg"; } catch (e) { blob = file; }
  }
  const path = S.open.id + "/" + Date.now() + "-" + name.replace(/[^\w.\-]+/g, "_");
  const ctype = ((blob.type || file.type || "application/octet-stream") + "").split(";")[0];
  const up = await sb.storage.from("chat-media").upload(path, blob, {contentType: ctype, upsert: false});
  if (up.error) { toast("Upload failed: " + up.error.message); return false; }
  const row = {conversation_id: S.open.id, sender_id: S.user.id, media_path: path, media_type: type}; if (S.replyTo) row.reply_to = S.replyTo.id;
  const {data, error} = await sb.from("messages").insert(row).select().single();
  if (error) { toast("Not sent: " + error.message); return false; }
  S.replyTo = null; paintReplyBar(); addMsg(data); refreshConvsSoon();
  return true;
}
const REC = {mr: null, chunks: [], stream: null, timer: null, t0: 0, cancel: false};
function showRec(on) {
  const r = $("#rec"), c = $("#cf"); if (r) r.hidden = !on; if (c) c.hidden = on;
  const t = $("#rt"); if (t && on) t.textContent = "0:00";
}
async function startRec() {
  if (!navigator.mediaDevices || !window.MediaRecorder) return toast("Voice notes are not supported in this browser.");
  try { REC.stream = await navigator.mediaDevices.getUserMedia({audio: true}); }
  catch (e) { return toast("Allow microphone access to record a voice note."); }
  const mime = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"].find(t => MediaRecorder.isTypeSupported(t)) || "";
  REC.chunks = []; REC.cancel = false;
  REC.mr = new MediaRecorder(REC.stream, mime ? {mimeType: mime} : undefined);
  REC.mr.ondataavailable = e => { if (e.data && e.data.size) REC.chunks.push(e.data); };
  REC.mr.onstop = async () => {
    REC.stream.getTracks().forEach(t => t.stop()); clearInterval(REC.timer); showRec(false);
    if (REC.cancel || !REC.chunks.length) return;
    const type = (REC.mr.mimeType || mime || "audio/webm").split(";")[0];
    const ext = type.includes("mp4") ? "m4a" : type.includes("ogg") ? "ogg" : "webm";
    await sendFile(new File([new Blob(REC.chunks, {type})], "voice-note." + ext, {type}));
  };
  REC.mr.start(); REC.t0 = Date.now(); showRec(true);
  REC.timer = setInterval(() => {
    const s = Math.floor((Date.now() - REC.t0) / 1000), t = $("#rt");
    if (t) t.textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
    if (s >= 300) stopRec(false);
  }, 500);
}
function stopRec(cancel) {
  if (REC.mr && REC.mr.state !== "inactive") { REC.cancel = !!cancel; REC.mr.stop(); }
}
async function sendMsg(text) {
  const body = text.trim(); if (!body || !S.open) return false;
  const row = {conversation_id: S.open.id, sender_id: S.user.id, body}; if (S.replyTo) row.reply_to = S.replyTo.id;
  const {data, error} = await sb.from("messages").insert(row).select().single();
  if (error) { toast("Not sent: " + error.message); return false; }
  S.replyTo = null; paintReplyBar(); addMsg(data); refreshConvsSoon();

}
function addMsg(m) {
  if (S.msgs.some(x => x.id === m.id)) return;

}
function paintMsgs() {
  const el = $("#msgs"); if (!el || !S.open) return;
  const near = el.scrollHeight - el.scrollTop - el.clientHeight < 140;

    const id = esc(m.id);

    const rxHtml = Object.keys(groups).length ? `<div class="rxs">${Object.keys(groups).map(e => `<button type="button" class="rx ${groups[e].includes(S.user.id) ? "on" : ""}" data-act="react" data-id="${id}" data-e="${esc(e)}">${esc(e)}${groups[e].length > 1 ? " " + groups[e].length : ""}</button>`).join("")}</div>` : "";
    const tg = tagsOf(m);

/* ---------- MESSAGE MENU: REACTIONS, TAGS, COPY, SAVE, DELETE ---------- */
const QUICK = ["👍", "❤️", "😂", "😮", "😢", "🙏"];
const TAGS = ["Important", "To-do", "Idea", "Money", "Contract"];
let metaTimer;
function loadMetaSoon() { clearTimeout(metaTimer); metaTimer = setTimeout(() => S.open && loadMeta(S.open.id), 300); }
async function loadMeta(convId) {

}
function openMsgMenu(id) { S.mm = id; paintMenu(); }
function closeMenu() { S.mm = null; document.querySelectorAll("#mmbg").forEach(e => e.remove()); }
function paintMenu() {
  const keep = $("#ctag") ? $("#ctag").value : "";
  document.querySelectorAll("#mmbg").forEach(e => e.remove());
  const m = S.msgs.find(x => x.id === S.mm); if (!m || m.deleted_at) return;

async function react(id, emoji) {
  const m = S.msgs.find(x => x.id === id); if (!m) return;
  const list = S.reacts[id] || [], mine = list.find(r => r.user_id === S.user.id);
  let error;
  if (mine && mine.emoji === emoji) {
    ({error} = await sb.from("message_reactions").delete().eq("message_id", id).eq("user_id", S.user.id));
    if (!error) S.reacts[id] = list.filter(r => r.user_id !== S.user.id);
  } else {
    ({error} = await sb.from("message_reactions").upsert({message_id: id, conversation_id: m.conversation_id, user_id: S.user.id, emoji}, {onConflict: "message_id,user_id"}));
    if (!error) S.reacts[id] = list.filter(r => r.user_id !== S.user.id).concat({message_id: id, user_id: S.user.id, emoji});

async function toggleTag(id, tag) {

    ({error} = await sb.from("message_tags").delete().eq("message_id", id).eq("user_id", S.user.id).eq("tag", tag));
    if (!error) S.tags[id] = cur.filter(t => t !== tag);
  } else {
    ({error} = await sb.from("message_tags").insert({message_id: id, conversation_id: m.conversation_id, user_id: S.user.id, tag}));

  if (error) return toast(SQLHINT(error));
  if (S.tagF && !(S.tags[id] || []).includes(S.tagF) && !Object.values(S.tags).some(a => a.includes(S.tagF))) S.tagF = null;

const SW = {el: null, x: 0, y: 0, dx: 0, mode: null, id: null};
function bindSwipe() {
  const box = $("#msgs"); if (!box) return;
  box.addEventListener("pointerdown", e => {
    if (e.pointerType === "mouse") return;
    const b = e.target.closest(".bub[data-mid]"); if (!b || e.target.closest("audio,video,input")) return;
    SW.el = b; SW.x = e.clientX; SW.y = e.clientY; SW.dx = 0; SW.mode = null; SW.id = b.dataset.mid;
  });
  box.addEventListener("pointermove", e => {
    if (!SW.el) return;
    const dx = e.clientX - SW.x, dy = e.clientY - SW.y;
    if (!SW.mode) { if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.5) SW.mode = "h"; else if (Math.abs(dy) > 10) SW.mode = "v"; }
    if (SW.mode === "h") { SW.dx = Math.max(-56, Math.min(56, dx)); SW.el.style.transition = "none"; SW.el.style.transform = "translateX(" + SW.dx + "px)"; }
  });
  const end = () => {

function openStories(uid) {

async function paintStory() {
  const sv = S.sv; if (!sv) return;
  clearTimeout(sv.t);
  const s = sv.list[sv.i], mine = sv.uid === S.user.id;
  let ov = $("#sv"); if (!ov) { ov = document.createElement("div"); ov.id = "sv"; ov.className = "sv"; ov.setAttribute("role", "dialog"); ov.setAttribute("aria-modal", "true"); ov.setAttribute("aria-label", "Status"); document.body.appendChild(ov); }

    <div class="svhead">${avatarHtml(sv.uid, S.names[sv.uid])}<div class="g"><div class="b tr">${esc(mine ? "My status" : (S.names[sv.uid] || "Someone"))}</div><div class="m">${esc(fmt(s.created_at))}</div></div>

      <button class="ib sm" type="button" data-act="svclose" aria-label="Close">${ico("x")}</button></div>
    <div class="svbody" ${s.kind === "text" ? `style="background:${esc(s.bg || "#b3121f")}"` : ""}>${s.kind === "text" ? `<div class="svtxt">${esc(s.caption || "")}</div>` : `<img id="svimg" alt="Status photo">`}</div>
    ${s.kind === "image" && s.caption ? `<div class="svcap">${esc(s.caption)}</div>` : ""}
    ${mine ? `<div class="svviews" id="svv">&nbsp;</div>` : ""}
    <button class="svnav l" type="button" data-act="svprev" aria-label="Previous"></button><button class="svnav r" type="button" data-act="svnext" aria-label="Next"></button>`;
  const stillHere = () => S.sv === sv && sv.list[sv.i] === s;
  if (!mine && !S.seen.has(s.id)) { S.seen.add(s.id); sb.from("story_views").insert({story_id: s.id}).then(() => {}, () => {}); }
  if (mine) sb.from("story_views").select("viewer_id", {count: "exact", head: true}).eq("story_id", s.id).then(r => { const v = $("#svv"); if (v && stillHere()) v.textContent = (r.count || 0) + " view" + (r.count === 1 ? "" : "s"); });
  if (s.kind === "text") { sv.t = setTimeout(nextStory, 5000); return; }
  if (!SMEDIA[s.id]) {
    const {data, error} = await sb.from("stories").select("media").eq("id", s.id).single();
    if (error || !data) { toast("Could not load this status."); return; }
    SMEDIA[s.id] = data.media;
  }
  if (!stillHere()) return;
  const img = $("#svimg"); if (img) img.src = SMEDIA[s.id];
  sv.t = setTimeout(nextStory, 5000);
}
function nextStory() { const sv = S.sv; if (!sv) return; if (sv.i < sv.list.length - 1) { sv.i++; paintStory(); } else closeStories(); }
function prevStory() { const sv = S.sv; if (!sv) return; if (sv.i > 0) { sv.i--; paintStory(); } }

async function vaultAct(act, id) {

    if (error) return toast(error.message);

    if (v.storage_path) await sb.storage.from("vault").remove([v.storage_path]);

    S.vault = S.vault.filter(x => x.id !== id); paintVault();
  } else if (act === "vopen") {
    const w = window.open("", "_blank");

}
function bindMe() {
  const af = $("#avf"); if (af) af.addEventListener("change", e => { const f = e.target.files[0]; if (f) setAvatar(f); });
  $("#pf").addEventListener("submit", async ev => {
    ev.preventDefault();
    const name = $("#pn").value.trim(); if (!name) return toast("Your name cannot be empty.");
    const {data, error} = await sb.from("profiles").update({display_name: name, about: $("#pa").value.trim()}).eq("id", S.user.id).select().single();
    if (error) return toast(error.message);
    S.me = data; S.names[S.user.id] = data.display_name; toast("Profile saved");
  });
}
async function toggleSetting(k) {
  const val = !S.me[k];
  const {data, error} = await sb.from("profiles").update({[k]: val}).eq("id", S.user.id).select().single();
  if (error) return toast(error.message);
  S.me = data; const main = $("#main"); if (main) { main.innerHTML = viewMe(); bindMe(); }
}

/* ---------- SHELL ---------- */
const TABS = [["chats", "Chats"], ["status", "Status"], ["vault", "Vault"], ["memories", "Memories"], ["me", "Me"]];
const CFILTERS = [["all", "All"], ["dm", "Personal"], ["group", "Groups"]];
function render() {
  if (!S.user) return renderAuth("in");
  if (S.open) return renderChat();
  const t0 = TABS.find(t => t[0] === S.tab) || [];
  const title = S.tab === "chats" ? `<img class="logo" src="${LOGO}" alt="" width="24" height="28"><span class="brand">TREASURE</span>` : esc(t0[1] || "");
  const chips = CFILTERS.map(f => `<button class="chip ${(S.cf || "all") === f[0] ? "on" : ""}" data-act="cfilter" data-f="${f[0]}">${f[1]}</button>`).join("");
  const view = {
    chats: `<input class="search" id="cq" type="search" placeholder="Search chats" aria-label="Search chats" value="${esc(S.q)}"><div class="chips">${chips}</div><div id="list"></div><button class="fab" data-act="newchat" aria-label="New chat">${ico("plus")}</button>`,
    status: viewStatus(), vault: viewVault(), memories: viewMems(), me: viewMe()
  }[S.tab];
  root.innerHTML = `<div class="app">
    <div class="top"><h1>${title}</h1></div>
    <div class="main" id="main">${view}</div>
    <nav class="nav" aria-label="Main">${TABS.map(t => `<button class="${S.tab === t[0] ? "on" : ""}" data-act="tab" data-t="${t[0]}" ${t[0] === "chats" ? 'id="chatsTab"' : ""}>${ico(t[0])}<span>${t[1]}</span>${t[0] === "chats" ? `<b class="badge navbadge" id="cbadge" hidden></b>` : ""}</button>`).join("")}</nav>
  </div>`;
  updateBadge();
  if (S.tab === "chats") paintConvs();
  if (S.tab === "status") { bindStatus(); loadStories(); }
  if (S.tab === "vault") { bindVault(); paintVault(); loadVault(); }
  if (S.tab === "memories") { bindMems(); paintMems(); loadMems(); }
  if (S.tab === "me") bindMe();
}

/* ---------- EVENTS ---------- */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const d = el.dataset;
  if (/bg$/.test(d.act) && e.target !== el) return;
  switch (d.act) {
    case "authmode": return renderAuth(d.mode);
    case "tab": S.tab = d.t; return render();
    case "open": return openConv(d.id);
    case "back": stopRec(true); closeMenu(); S.open = null; S.msgQ = null; S.tagF = null; S.replyTo = null; render(); return refreshConvs();
    case "legal": return openLegal(d.k);
    case "legalclose": case "legalbg": if (d.act === "legalbg" && e.target !== el) return; return closeLegal();
    case "delmsg": closeMenu(); return deleteMsg(d.id);
    case "msgsearch": return toggleMsgSearch();
    case "sound": try { localStorage.setItem("tr_sound", soundOn() ? "off" : "on"); } catch (er) {} { const m = $("#main"); if (m) { m.innerHTML = viewMe(); bindMe(); } } return;
    case "delacct": return deleteAccount();
    case "mic": return startRec();
    case "recsend": return stopRec(false);
    case "reccancel": return stopRec(true);
    case "invite": return shareInvite();
    case "savemsg": closeMenu(); return saveMsgToVault(d.id);
    case "newchat": return openSheet();
    case "sheetclose": case "sheetbg": return closeSheet();
    case "sheetmode": S.sheet.mode = d.mode; S.sheet.picked = new Set(); return paintSheet();
    case "startdm": return startDm(d.id);
    case "pick": S.sheet.picked.has(d.id) ? S.sheet.picked.delete(d.id) : S.sheet.picked.add(d.id); return paintSheetList();
    case "makegroup": return makeGroup();
    case "vcat": S.vcat = d.c; return paintVault();
    case "vfav": case "vlock": case "vdel": case "vopen": return vaultAct(d.act, d.id);
    case "mdel": return delMem(d.id);
    case "tog": return toggleSetting(d.k);
    case "install": if (S.installEv) { S.installEv.prompt(); S.installEv = null; el.hidden = true; } return;
    case "signout": return signOut();
    case "msgmenu": if (Date.now() - S.noClick < 400 || e.target.closest("a,audio,video")) return; return openMsgMenu(d.id);
    case "mmbg": return closeMenu();
    case "replymsg": closeMenu(); return startReply(d.id);
    case "replyx": S.replyTo = null; return paintReplyBar();
    case "jump": { const t = document.querySelector('.bub[data-mid="' + CSS.escape(d.id) + '"]'); if (t) { t.scrollIntoView({block: "center", behavior: "smooth"}); t.classList.add("flash"); setTimeout(() => t.classList.remove("flash"), 1200); } else toast("That message is further back in the chat."); return; }
    case "react": closeMenu(); return react(d.id, d.e);
    case "tagtoggle": return toggleTag(d.id, d.t);
    case "tagadd": return addTag(d.id);
    case "tagf": S.tagF = S.tagF === d.t ? null : d.t; paintTagChips(); return paintMsgs();
    case "copymsg": closeMenu(); return copyMsg(d.id);
    case "emojitoggle": { const p = $("#emo"); if (p) p.hidden = !p.hidden; return; }
    case "emo": return insertEmoji(d.e);
    case "callsoon": return toast("Voice and video calls are coming soon.");
    case "cfilter": S.cf = d.f; return render();
    case "textstatus": return openTextStatus();
    case "tsbg": case "tsclose": return closeTextStatus();
    case "tsbgpick": { S.tsBg = d.c; const pv = $("#tsprev"); if (pv) pv.style.background = d.c; document.querySelectorAll(".swatch").forEach(x => x.classList.toggle("on", x.dataset.c === d.c)); return; }
    case "tspost": { const t = $("#tst"), v = t ? t.value.trim() : ""; if (!v) return toast("Type something first."); return postStory("text", null, v, S.tsBg); }
    case "viewstory": return openStories(d.u);
    case "svclose": return closeStories();
    case "svnext": return nextStory();
    case "svprev": return prevStory();
    case "svdel": return delStory();
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") { if ($("#sv")) closeStories(); else if ($("#mmbg")) closeMenu(); else if ($("#tsbg")) closeTextStatus(); else if ($("#legalbg")) closeLegal(); else if (S.sheet) closeSheet(); } });
document.addEventListener("input", e => {
  if (e.target.id === "cq") { S.q = e.target.value; paintConvs(); }
  else if (e.target.id === "msq") { S.msgQ = e.target.value; paintMsgs(); }
});

/* ---------- START ---------- */
(async function boot() {
  try {
    const {data: {session}} = await sb.auth.getSession();
    if (RECOVERY && session) { S.user = session.user; return renderReset(); }
    if (RECOVERY) return renderAuth("in", "That reset link has expired. Tap Forgot password to get a new one.");
    if (session) await enter(session.user); else renderAuth(pendingAdd() ? "up" : "in");
  } catch (e) { renderAuth("in", "Could not reach TREASURE. Check your connection and reload."); }
})();
</script>
</body>
</html>
