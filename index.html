<style>
:root{
  --bg:#f6f4f2; --card:#ffffff; --ink:#17120f; --mute:#6b625c; --line:#e6e1dc;
  --red:#b3121f; --on-red:#ffffff; --bubble-in:#ffffff; --shadow:0 1px 2px rgba(23,18,15,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121010; --card:#1c1918; --ink:#f3eeea; --mute:#a39a93; --line:#2e2927; --red:#c8202d; --bubble-in:#25211f; --shadow:none; color-scheme:dark}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
[hidden]{display:none!important}

.app{height:100dvh;max-width:720px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);
  padding-top:env(safe-area-inset-top,0px);border-inline:1px solid transparent}
@media(min-width:760px){.app{border-inline-color:var(--line)}}
.top{display:flex;align-items:center;gap:10px;padding:12px max(16px,env(safe-area-inset-left,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--card);min-height:56px}
.top h1{margin:0;font-size:18px;font-weight:700;flex:1;min-width:0}
.brand{color:var(--red);letter-spacing:.22em;font-weight:800}
.main{flex:1;overflow:auto;padding:12px max(16px,env(safe-area-inset-left,0px)) 96px;-webkit-overflow-scrolling:touch}
.nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;background:none;border:0;padding:13px 0;font-size:13px;color:var(--mute)}
.nav button.on{color:var(--red);font-weight:700;box-shadow:inset 0 2px 0 var(--red)}

.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;box-shadow:var(--shadow)}
button.row:active{background:var(--bg)}
.g{flex:1;min-width:0}
.tr{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b{font-weight:600}
.m{color:var(--mute);font-size:13px}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.av{width:42px;height:42px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;flex:none}
.badge{background:var(--red);color:var(--on-red);border-radius:99px;font-size:11px;font-weight:700;padding:1px 7px;min-width:20px;text-align:center}

.btn{background:var(--red);color:var(--on-red);border:0;border-radius:10px;padding:10px 16px;font-weight:600}
.btn.o{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.s{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.55}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 13px;margin:0 6px 8px 0;font-size:13px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.ic{padding:6px 10px}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
label.f{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
.form{display:grid;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.empty{color:var(--mute);text-align:center;padding:36px 12px}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;border:0;background:var(--red);color:var(--on-red);font-size:28px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.28)}

.msgs{flex:1;overflow:auto;padding:10px max(14px,env(safe-area-inset-left,0px)) 10px;display:flex;flex-direction:column;gap:2px}
.sep{align-self:center;color:var(--mute);font-size:12px;margin:10px 0 6px}
.bub{max-width:80%;padding:7px 11px;border-radius:14px;background:var(--bubble-in);border:1px solid var(--line);align-self:flex-start;overflow-wrap:anywhere}
.bub .txt{white-space:pre-wrap}
.bub.me{align-self:flex-end;background:var(--red);color:var(--on-red);border-color:var(--red)}
.bub .who{font-size:12px;font-weight:700;color:var(--red);margin-bottom:1px}
.bub .meta{font-size:11px;opacity:.7;margin-top:2px;display:flex;gap:8px;white-space:normal}
.bub .meta button{background:none;border:0;padding:0;color:inherit;text-decoration:underline;font-size:11px}
.composer{display:flex;gap:8px;padding:10px max(12px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--card)}
.composer input{flex:1;min-width:0}
.ib{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--ink);padding:0;cursor:pointer}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rec{display:flex;align-items:center;gap:10px;padding:10px max(12px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--card)}
.rec .dot{width:10px;height:10px;border-radius:50%;background:var(--red);animation:blink 1s infinite}
.rec .g{font-weight:600}
@keyframes blink{50%{opacity:.25}}
.bub img{display:block;max-width:100%;max-height:340px;border-radius:10px;margin:2px 0}
.bub video{display:block;max-width:100%;max-height:340px;border-radius:10px}
.bub audio{display:block;width:230px;max-width:100%}
.bub a.file{color:inherit;text-decoration:underline;display:block;padding:2px 0}

.auth{min-height:100dvh;display:grid;place-items:center;padding:24px max(20px,env(safe-area-inset-left,0px));background:#17120f;color:#fff}
.auth .box{width:100%;max-width:380px}
.auth h1{font-size:36px;letter-spacing:.25em;margin:0 0 4px;color:#fff;font-weight:800}
.auth .tag{letter-spacing:.2em;font-size:12px;opacity:.8;margin:0 0 22px}
.auth input{background:#241e1b;border-color:#3a322e;color:#fff;margin-bottom:10px}
.auth .err{color:#ffb4ab;min-height:20px;font-size:14px;margin:2px 0 8px}
.auth .ok{color:#b8f0c8}
.auth .btn{width:100%;padding:12px}
.auth .link{background:none;border:0;color:#fff;text-decoration:underline;margin-top:14px;width:100%;padding:8px}

.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);border-radius:16px 16px 0 0;width:100%;max-width:720px;max-height:86dvh;display:flex;flex-direction:column;padding:14px max(16px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px))}
.sheet .list{overflow:auto;flex:1;margin:10px 0}
.sheet .row{box-shadow:none}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#17120f;color:#fff;padding:9px 16px;border-radius:99px;z-index:50;max-width:90%;font-size:14px;text-align:center}
.tg{width:44px;height:26px;border-radius:99px;background:var(--line);border:0;position:relative;flex:none;padding:0}
.tg:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.tg.on{background:var(--red)}.tg.on:after{left:21px}
h2{font-size:15px;margin:20px 0 8px}
.auth .fine{font-size:12px;opacity:.8;text-align:center;margin:14px 0 0}
.auth .fine button{background:none;border:0;color:#fff;text-decoration:underline;padding:0;font-size:12px}
.legal h2{font-size:15px;margin:16px 0 4px}.legal p{margin:0;color:var(--mute)}
.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.lg{width:84px;height:84px;font-size:32px;margin:0 auto 8px}
.search{margin-bottom:10px}
.chatbar{display:flex;gap:8px;align-items:center;padding:8px max(14px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--card)}
.chatbar input{flex:1}
.tabbadge{display:inline-block;margin-left:6px;vertical-align:middle}
.danger{color:#c4202d;border-color:#c4202d}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>

function fmt(d) {
  const t = new Date(d), n = new Date();
  if (t.toDateString() === n.toDateString()) return t.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
  const y = new Date(n.getTime() - 864e5);
  if (t.toDateString() === y.toDateString()) return "Yesterday";
  return t.toLocaleDateString([], {day: "numeric", month: "short"});
}
function dayLabel(d) {
  const t = new Date(d), n = new Date();
  if (t.toDateString() === n.toDateString()) return "Today";
  const y = new Date(n.getTime() - 864e5);
  if (t.toDateString() === y.toDateString()) return "Yesterday";
  return t.toLocaleDateString([], {weekday: "long", day: "numeric", month: "long"});
}
let toastTimer;
function toast(msg) {
  document.querySelectorAll(".toast").forEach(e => e.remove());
  const el = document.createElement("div");
  el.className = "toast"; el.setAttribute("role", "status"); el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 2600);
}

/* ---------- ICON + MANIFEST (drawn in the browser so the app is one file) ---------- */
function makeIcon(size) {
  const c = document.createElement("canvas"); c.width = c.height = size;
  const g = c.getContext("2d");
  g.fillStyle = "#b3121f"; g.fillRect(0, 0, size, size);
  g.fillStyle = "#ffffff"; g.font = "800 " + Math.round(size * 0.62) + "px system-ui,sans-serif";
  g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("T", size / 2, size / 2 + size * 0.03);
  return c.toDataURL("image/png");
}
try {
  const i192 = makeIcon(192), i512 = makeIcon(512);
  const apple = document.createElement("link"); apple.rel = "apple-touch-icon"; apple.href = makeIcon(180); document.head.appendChild(apple);
  const fav = document.createElement("link"); fav.rel = "icon"; fav.href = i192; document.head.appendChild(fav);
  const base = location.origin + location.pathname.replace(/[^/]*$/, "");
  const manifest = {
    name: "TREASURE", short_name: "TREASURE", start_url: base, scope: base, display: "standalone",
    background_color: "#17120f", theme_color: "#b3121f",
    icons: [{src: i192, sizes: "192x192", type: "image/png", purpose: "any"}, {src: i512, sizes: "512x512", type: "image/png", purpose: "any"}]
  };
  const ml = document.createElement("link"); ml.rel = "manifest";
  ml.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type: "application/manifest+json"}));
  document.head.appendChild(ml);
} catch (e) { /* the app still works without install support */ }
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); S.installEv = e; const b = $("#installBtn"); if (b) b.hidden = false; });

/* ---------- INVITE LINKS ---------- */
const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
try {
  const m = location.hash.match(/add=([^&]+)/);
  if (m && UUID_RE.test(m[1])) { localStorage.setItem("tr_add", m[1]); history.replaceState(null, "", location.pathname + location.search); }
} catch (e) { /* storage may be blocked; the link still opens the app */ }
const pendingAdd = () => { try { return localStorage.getItem("tr_add"); } catch (e) { return null; } };
const clearPendingAdd = () => { try { localStorage.removeItem("tr_add"); } catch (e) {} };
async function shareInvite() {
  const link = location.origin + location.pathname + "#add=" + S.user.id;
  if (navigator.share) { try { await navigator.share({title: "TREASURE", text: "Chat with me on TREASURE", url: link}); return; } catch (e) { if (e && e.name === "AbortError") return; } }
  try { await navigator.clipboard.writeText(link); toast("Invite link copied. Paste it in WhatsApp or SMS."); }
  catch (e) { prompt("Copy your invite link:", link); }
}

/* ---------- PRIVACY POLICY AND TERMS ---------- */
// Template text for a beta. Have a Nigerian lawyer review it before public launch.
const LEGAL_DOCS = {
  privacy: {title: "Privacy Policy", body: [
    ["Who we are", `${LEGAL.company} ("we") runs the TREASURE messaging app. Questions about your data: ${LEGAL.email}.`],
    ["What we collect", "Your email address, name, optional profile photo and about line; the messages, photos, voice notes and files you send; items you save in your Vault and Memories; and basic technical data needed to run the app."],
    ["Why we use it", "To create your account, deliver your messages, keep your Vault and Memories, keep the service secure, and fix problems. We do not sell your data and we do not show ads."],
    ["Treasure AI", "AI features are off by default. If AI features are added, they will only read your messages or Vault when you switch the matching setting on, and you can switch it off at any time."],
    ["Encryption", "Data is encrypted while it travels between your phone and our servers. Messages are stored on our servers and are not yet end-to-end encrypted. We will not read your private messages unless needed to keep the service secure or required by law."],
    ["Who else handles data", "We use hosting and database providers (currently Supabase and Netlify) to run TREASURE. They process data only to provide those services."],
    ["Keeping and deleting data", "We keep your data while your account is open. In Me, choose Delete my account to remove your profile, messages, Vault and Memories. Backups may keep copies for up to 30 days."],
    ["Your rights", "Under the Nigeria Data Protection Act 2023 you may ask to see, correct or delete your data, or object to how it is used. Contact us at the email above."],
    ["Age", "TREASURE is for people aged 18 and over."],
    ["Changes", `We may update this policy and will show the new date here. Last updated: ${LEGAL.updated}.`]
  ]},
  terms: {title: "Terms of Use", body: [
    ["Using TREASURE", "By creating an account you agree to these terms. You must be 18 or older and give accurate details. You are responsible for your password and for what happens on your account."],
    ["Beta service", "TREASURE is in beta. It is provided as is, may change or go offline, and may contain errors. Please keep copies of anything important."],
    ["What you may not do", "Do not use TREASURE for anything illegal, to harass or threaten others, to send spam or scams, to share content that exploits children, to spread malware, or to try to break or misuse the service."],
    ["Your content", "You own what you send and save. You allow us to store and deliver it so the app can work. You are responsible for having the right to share it."],
    ["Suspending accounts", "We may suspend or remove accounts that break these terms or put others at risk."],
    ["Limits of liability", "To the extent the law allows, we are not liable for lost data, lost profits or indirect losses from using TREASURE."],
    ["Governing law", "These terms are governed by the laws of the Federal Republic of Nigeria."],
    ["Contact", `${LEGAL.email}. Last updated: ${LEGAL.updated}.`]
  ]}
};
function openLegal(kind) {
  const doc = LEGAL_DOCS[kind]; if (!doc) return;
  closeLegal();
  const bg = document.createElement("div"); bg.className = "sheet-bg"; bg.id = "legalbg"; bg.dataset.act = "legalbg";
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(doc.title)}">
    <div class="row" style="border:0;padding:0;margin:0;background:none;box-shadow:none"><h1 class="g" style="margin:0;font-size:18px">${esc(doc.title)}</h1>
    <button class="chip ic" data-act="legalclose" aria-label="Close">✕</button></div>
    <div class="list legal">${doc.body.map(s => `<h2>${esc(s[0])}</h2><p>${esc(s[1])}</p>`).join("")}</div></div>`;
  document.body.appendChild(bg);
}
function closeLegal() { const e = $("#legalbg"); if (e) e.remove(); }

/* ---------- AUTH ---------- */
function renderAuth(mode, msg, ok) {
  mode = mode || "in";
  const forgot = mode === "forgot";
  root.innerHTML = `
  <div class="auth"><form class="box" id="authForm" novalidate>
    <h1>TREASURE</h1><p class="tag">DISCOVER. CONNECT. VALUE.</p>
    ${pendingAdd() ? `<p class="tag" style="opacity:1;letter-spacing:.04em;font-size:14px">A friend invited you to chat on TREASURE. Sign in or create an account to start.</p>` : ""}
    ${forgot ? `<p class="tag" style="opacity:1;letter-spacing:.04em;font-size:14px">Enter your email and we will send you a link to choose a new password.</p>` : ""}
    ${mode === "up" ? `<input id="an" autocomplete="name" placeholder="Your name" aria-label="Your name">` : ""}
    <input id="ae" type="email" autocomplete="email" placeholder="Email" aria-label="Email">
    ${forgot ? "" : `<input id="ap" type="password" autocomplete="${mode === "up" ? "new-password" : "current-password"}" placeholder="Password (6+ characters)" aria-label="Password">`}
    <div class="err ${ok ? "ok" : ""}" id="aerr" role="alert">${esc(msg || "")}</div>
    <button class="btn" id="abtn" type="submit">${mode === "up" ? "Create account" : forgot ? "Send reset link" : "Sign in"}</button>
    ${mode === "in" ? `<button class="link" type="button" data-act="authmode" data-mode="forgot">Forgot password?</button>` : ""}
    <button class="link" type="button" data-act="authmode" data-mode="${mode === "up" || forgot ? "in" : "up"}">${mode === "up" ? "I already have an account" : forgot ? "Back to sign in" : "New here? Create an account"}</button>
    <p class="fine">By continuing you agree to our <button type="button" data-act="legal" data-k="terms">Terms</button> and <button type="button" data-act="legal" data-k="privacy">Privacy Policy</button>.</p>
  </form></div>`;
  $("#authForm").addEventListener("submit", ev => { ev.preventDefault(); doAuth(mode); });
}
function renderReset(msg) {
  root.innerHTML = `
  <div class="auth"><form class="box" id="resetForm" novalidate>
    <h1>TREASURE</h1><p class="tag">CHOOSE A NEW PASSWORD</p>
    <input id="np" type="password" autocomplete="new-password" placeholder="New password (6+ characters)" aria-label="New password">
    <input id="np2" type="password" autocomplete="new-password" placeholder="Repeat new password" aria-label="Repeat new password">
    <div class="err" id="aerr" role="alert">${esc(msg || "")}</div>
    <button class="btn" id="abtn" type="submit">Save new password</button>
  </form></div>`;
  $("#resetForm").addEventListener("submit", async ev => {
    ev.preventDefault();
    const a = $("#np").value, b = $("#np2").value, err = t => { $("#aerr").textContent = t; $("#abtn").disabled = false; };
    if (a.length < 6) return err("Use at least 6 characters.");
    if (a !== b) return err("The two passwords do not match.");
    $("#abtn").disabled = true;
    const {data, error} = await sb.auth.updateUser({password: a});
    if (error) return err(error.message);
    history.replaceState(null, "", location.pathname + location.search);
    await enter(data.user);
    toast("Password updated");
  });
}
async function doAuth(mode) {
  const email = $("#ae").value.trim(), pw = mode === "forgot" ? "" : $("#ap").value, name = mode === "up" ? $("#an").value.trim() : "";
  const err = t => { $("#aerr").className = "err"; $("#aerr").textContent = t; $("#abtn").disabled = false; };
  if (mode === "forgot") {
    if (!email) return err("Enter your email.");
    $("#abtn").disabled = true;
    const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo: location.origin + location.pathname});
    if (error) return err(error.message);
    return renderAuth("in", "If that email has an account, a reset link is on its way. Check your inbox and spam folder.", true);
  }
  if (!email || !pw) return err("Enter your email and password.");
  if (mode === "up" && !name) return err("Enter your name so friends can find you.");
  if (pw.length < 6) return err("Use at least 6 characters for the password.");
  $("#abtn").disabled = true; $("#aerr").textContent = "";
  try {
    if (mode === "up") {
      const {data, error} = await sb.auth.signUp({email, password: pw, options: {data: {display_name: name}}});
      if (error) return err(error.message);
      if (!data.session) return renderAuth("in", "Account created. Check your email to confirm it, then sign in.", true);
      await enter(data.user);
    } else {
      const {data, error} = await sb.auth.signInWithPassword({email, password: pw});
      if (error) return err(error.message);
      await enter(data.user);
    }
  } catch (e) { err("Could not reach TREASURE. Check your connection and try again."); }
}
async function signOut() {
  S.user = null; stopRealtime();
  await sb.auth.signOut();
  S.me = null; S.convs = []; S.open = null; S.vault = []; S.mems = [];

function squarePhoto(file, size) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {

async function refreshConvs() {

  const [a, b, c] = await Promise.all([
    sb.from("conversation_members").select("conversation_id,user_id,profiles(display_name,avatar_url)").in("conversation_id", ids),
    sb.from("messages").select("id,conversation_id,sender_id,body,media_type,created_at,deleted_at").in("conversation_id", ids).order("created_at", {ascending: false}).limit(300),
    sb.rpc("unread_counts")

  }).sort((x, y) => new Date(y.time) - new Date(x.time));

/* ---------- PHOTOS, FILES, VOICE NOTES ---------- */
const URLS = {};
const mediaLabel = t => t === "image" ? "Photo" : t === "voice" ? "Voice note" : t === "video" ? "Video" : "File";
async function signedUrls(paths) {
  const need = paths.filter(p => !URLS[p] || URLS[p].exp < Date.now() + 60000);
  if (!need.length) return;
  const {data, error} = await sb.storage.from("chat-media").createSignedUrls(need, 3600);
  if (error || !data) return;
  data.forEach(r => { if (r.signedUrl && r.path) URLS[r.path] = {url: r.signedUrl, exp: Date.now() + 3600e3}; });
}
function mediaHtml(m) {
  if (!m.media_path || m.deleted_at) return "";
  const p = esc(m.media_path), u = (URLS[m.media_path] || {}).url, src = u ? ` src="${esc(u)}"` : "", href = u ? ` href="${esc(u)}"` : "";
  if (m.media_type === "image") return `<a data-path="${p}"${href} target="_blank" rel="noopener"><img data-path="${p}"${src} alt="Photo"></a>`;
  if (m.media_type === "voice") return `<audio controls preload="none" data-path="${p}"${src}></audio>`;
  if (m.media_type === "video") return `<video controls playsinline preload="metadata" data-path="${p}"${src}></video>`;
  const name = esc(m.media_path.split("/").pop().replace(/^\d+-/, ""));
  return `<a class="file" data-path="${p}"${href} target="_blank" rel="noopener">Open file: ${name}</a>`;
}
async function hydrateMedia() {
  const els = [...document.querySelectorAll("#msgs [data-path]")];
  if (!els.length) return;
  await signedUrls([...new Set(els.map(e => e.dataset.path))]);
  els.forEach(e => {
    const u = URLS[e.dataset.path]; if (!u) return;
    if (e.tagName === "A") { if (!e.getAttribute("href")) e.href = u.url; return; }
    if (!e.getAttribute("src")) {
      if (e.tagName === "IMG") e.addEventListener("load", () => { const box = $("#msgs"); if (box && S.stick) box.scrollTop = box.scrollHeight; }, {once: true});
      e.src = u.url;
    }
  });
}
function compressImage(file, max, quality) {
  max = max || 1280; quality = quality || 0.8;
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const k = Math.min(1, max / Math.max(img.width, img.height)), w = Math.round(img.width * k), h = Math.round(img.height * k);
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      c.toBlob(b => b ? res(b) : rej(new Error("compress failed")), "image/jpeg", quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("image load failed")); };
    img.src = url;
  });
}
async function sendFile(file) {
  if (!file || !S.open) return false;
  if (file.size > 25 * 1024 * 1024) { toast("That file is too large. The limit is 25 MB."); return false; }
  const kind = (file.type || "").split("/")[0];
  const type = kind === "image" ? "image" : kind === "video" ? "video" : kind === "audio" ? "voice" : "document";
  let blob = file, name = file.name || "file";
  toast("Sending…");
  if (type === "image" && file.type !== "image/gif") {
    try { blob = await compressImage(file); name = name.replace(/\.[^.]+$/, "") + ".jpg"; } catch (e) { blob = file; }
  }
  const path = S.open.id + "/" + Date.now() + "-" + name.replace(/[^\w.\-]+/g, "_");
  const ctype = ((blob.type || file.type || "application/octet-stream") + "").split(";")[0];
  const up = await sb.storage.from("chat-media").upload(path, blob, {contentType: ctype, upsert: false});
  if (up.error) { toast("Upload failed: " + up.error.message); return false; }
  const {data, error} = await sb.from("messages").insert({conversation_id: S.open.id, sender_id: S.user.id, media_path: path, media_type: type}).select().single();
  if (error) { toast("Not sent: " + error.message); return false; }
  addMsg(data); refreshConvsSoon();
  return true;
}
const REC = {mr: null, chunks: [], stream: null, timer: null, t0: 0, cancel: false};
function showRec(on) {
  const r = $("#rec"), c = $("#cf"); if (r) r.hidden = !on; if (c) c.hidden = on;
  const t = $("#rt"); if (t && on) t.textContent = "0:00";
}
async function startRec() {
  if (!navigator.mediaDevices || !window.MediaRecorder) return toast("Voice notes are not supported in this browser.");
  try { REC.stream = await navigator.mediaDevices.getUserMedia({audio: true}); }
  catch (e) { return toast("Allow microphone access to record a voice note."); }
  const mime = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"].find(t => MediaRecorder.isTypeSupported(t)) || "";
  REC.chunks = []; REC.cancel = false;
  REC.mr = new MediaRecorder(REC.stream, mime ? {mimeType: mime} : undefined);
  REC.mr.ondataavailable = e => { if (e.data && e.data.size) REC.chunks.push(e.data); };
  REC.mr.onstop = async () => {
    REC.stream.getTracks().forEach(t => t.stop()); clearInterval(REC.timer); showRec(false);
    if (REC.cancel || !REC.chunks.length) return;
    const type = (REC.mr.mimeType || mime || "audio/webm").split(";")[0];
    const ext = type.includes("mp4") ? "m4a" : type.includes("ogg") ? "ogg" : "webm";
    await sendFile(new File([new Blob(REC.chunks, {type})], "voice-note." + ext, {type}));
  };
  REC.mr.start(); REC.t0 = Date.now(); showRec(true);
  REC.timer = setInterval(() => {
    const s = Math.floor((Date.now() - REC.t0) / 1000), t = $("#rt");
    if (t) t.textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
    if (s >= 300) stopRec(false);
  }, 500);
}
function stopRec(cancel) {

}
async function sendMsg(text) {

      <div class="g"><button class="chip ${sh.mode === "dm" ? "on" : ""}" data-act="sheetmode" data-mode="dm">Direct chat</button><button class="chip ${sh.mode === "group" ? "on" : ""}" data-act="sheetmode" data-mode="group">New group</button></div>
      <button class="chip ic" data-act="sheetclose" aria-label="Close">✕</button></div>
    ${sh.mode === "group" ? `<input id="gt" placeholder="Group name" aria-label="Group name" style="margin-top:8px">` : ""}
    <input id="sq" placeholder="Search people by name" aria-label="Search people" style="margin-top:8px" value="${esc(sh.q)}">
    <div class="list" id="plist"></div>
    ${sh.mode === "group" ? `<button class="btn" data-act="makegroup">Create group</button>` : ""}
  </div>`;
  document.body.appendChild(bg);
  $("#sq").addEventListener("input", e => { S.sheet.q = e.target.value; paintSheetList(); });
  paintSheetList();
}
function paintSheetList() {
  const el = $("#plist"); if (!el || !S.sheet) return;
  const q = S.sheet.q.trim().toLowerCase();
  const list = S.sheet.people.filter(p => !q || (p.display_name || "").toLowerCase().includes(q));
  if (!list.length) { el.innerHTML = `<div class="empty"><b>No one found</b>Ask your friends to create a TREASURE account, then they appear here.</div>`; return; }
  el.innerHTML = list.map(p => {
    const picked = S.sheet.picked.has(p.id);
    return `<button class="row" data-act="${S.sheet.mode === "dm" ? "startdm" : "pick"}" data-id="${esc(p.id)}">
      ${avatarHtml(p.id, p.display_name)}
      <div class="g"><div class="b tr">${esc(p.display_name)}</div><div class="m tr">${esc(p.about || "")}</div></div>
      ${S.sheet.mode === "group" ? `<span class="chip ${picked ? "on" : ""}" style="margin:0">${picked ? "Added" : "Add"}</span>` : ""}</button>`;
  }).join("");
}
function closeSheet() { S.sheet = null; document.querySelectorAll(".sheet-bg").forEach(e => e.remove()); }
async function startDm(id) {
  const {data, error} = await sb.rpc("start_direct_chat", {other: id});
  if (error) return toast(error.message);
  closeSheet(); await refreshConvs(); openConv(data);
}
async function makeGroup() {
  const title = ($("#gt").value || "").trim(), ids = [...S.sheet.picked];
  if (!title) return toast("Give the group a name.");
  if (!ids.length) return toast("Add at least one person.");
  const {data, error} = await sb.rpc("create_group", {group_title: title, member_ids: ids});
  if (error) return toast(error.message);
  closeSheet(); await refreshConvs(); openConv(data);
}

/* ---------- VAULT ---------- */
const CATS = ["Documents", "Photos", "Messages", "Collections"];
async function loadVault() {
  const {data, error} = await sb.from("vault_items").select("*").order("created_at", {ascending: false});
  if (error) { toast(error.message); return; }
  S.vault = data || []; paintVault();
}
function viewVault() {
  return `<form class="form" id="vf" autocomplete="off">
    <input id="vt" placeholder="Title (e.g. Passport scan, Contract notes)" aria-label="Title">
    <input id="vn" placeholder="Note (optional)" aria-label="Note">
    <div class="two"><select id="vc" aria-label="Category">${CATS.map(c => `<option>${c}</option>`).join("")}</select>
      <label class="btn o" style="text-align:center;display:block">Attach file<input id="vfile" type="file" hidden></label></div>
    <div class="m" id="vfname" hidden></div>
    <button class="btn" id="vsave" type="submit">Save to Vault</button>
  </form>
  <div id="chips"></div><div id="list"></div>`;
}
function bindVault() {
  $("#vfile").addEventListener("change", e => { const f = e.target.files[0], n = $("#vfname"); n.hidden = !f; n.textContent = f ? "Attached: " + f.name : ""; });
  $("#vf").addEventListener("submit", async ev => {
    ev.preventDefault();
    const f = $("#vfile").files[0], title = $("#vt").value.trim() || (f ? f.name : "");
    if (!title) return toast("Add a title or attach a file.");
    const btn = $("#vsave"); btn.disabled = true;
    let path = null;
    if (f) {
      path = S.user.id + "/" + Date.now() + "-" + f.name.replace(/[^\w.\-]+/g, "_");
      const up = await sb.storage.from("vault").upload(path, f, {upsert: false});
      if (up.error) { btn.disabled = false; return toast("Upload failed: " + up.error.message); }
    }
    const {error} = await sb.from("vault_items").insert({title, category: $("#vc").value, note: $("#vn").value.trim() || null, storage_path: path});
    btn.disabled = false;
    if (error) return toast("Could not save: " + error.message);
    $("#vf").reset(); $("#vfname").hidden = true;
    toast("Saved to your Vault"); loadVault();
  });
}
function paintVault() {
  const ch = $("#chips"), el = $("#list"); if (!el || S.tab !== "vault") return;
  ch.innerHTML = ["All", ...CATS].map(c => `<button class="chip ${S.vcat === c ? "on" : ""}" data-act="vcat" data-c="${c}">${c}</button>`).join("");
  const items = S.vault.filter(v => S.vcat === "All" || v.category === S.vcat);
  if (!items.length) { el.innerHTML = `<div class="empty"><b>Nothing here yet</b>Save documents, photos and important messages. Only you can see your Vault.</div>`; return; }
  el.innerHTML = items.map(v => `
    <div class="row"><div class="g">
      <div class="b">${v.locked ? "🔒 " : ""}${esc(v.title)}</div>
      <div class="m">${esc(v.category)} · ${esc(fmt(v.created_at))}</div>
      ${v.note && !v.locked ? `<div class="m tr">${esc(v.note)}</div>` : ""}</div>
      ${v.storage_path && !v.locked ? `<button class="chip" data-act="vopen" data-id="${esc(v.id)}">Open</button>` : ""}
      <button class="chip" data-act="vfav" data-id="${esc(v.id)}" aria-label="Favourite">${v.favourite ? "★" : "☆"}</button>
      <button class="chip" data-act="vlock" data-id="${esc(v.id)}">${v.locked ? "Unlock" : "Lock"}</button>
      <button class="chip" data-act="vdel" data-id="${esc(v.id)}" aria-label="Delete">✕</button></div>`).join("");
}
async function vaultAct(act, id) {
  const v = S.vault.find(x => x.id === id); if (!v) return;
  if (act === "vfav" || act === "vlock") {
    const patch = act === "vfav" ? {favourite: !v.favourite} : {locked: !v.locked};
    const {error} = await sb.from("vault_items").update(patch).eq("id", id);
    if (error) return toast(error.message);
    Object.assign(v, patch); paintVault();
  } else if (act === "vdel") {
    if (!confirm("Delete \"" + v.title + "\" from your Vault?")) return;
    if (v.storage_path) await sb.storage.from("vault").remove([v.storage_path]);
    const {error} = await sb.from("vault_items").delete().eq("id", id);
    if (error) return toast(error.message);
    S.vault = S.vault.filter(x => x.id !== id); paintVault();
  } else if (act === "vopen") {
    const w = window.open("", "_blank");
    const {data, error} = await sb.storage.from("vault").createSignedUrl(v.storage_path, 120);
    if (error) { if (w) w.close(); return toast(error.message); }
    if (w) w.location = data.signedUrl; else location.href = data.signedUrl;
  }
}

/* ---------- MEMORIES ---------- */
async function loadMems() {
  const {data, error} = await sb.from("memories").select("*").order("occurred_on", {ascending: false});
  if (error) { toast(error.message); return; }
  S.mems = data || []; paintMems();
}
function viewMems() {
  const today = new Date().toISOString().slice(0, 10);
  return `<form class="form" id="mf" autocomplete="off">
    <input id="mt" placeholder="What do you want to remember?" aria-label="Memory title">
    <div class="two"><input id="md" type="date" value="${today}" aria-label="Date"><input id="mn" placeholder="Note (optional)" aria-label="Note"></div>
    <button class="btn" type="submit">Save memory</button></form>
    <div id="list"></div>`;
}
function bindMems() {
  $("#mf").addEventListener("submit", async ev => {
    ev.preventDefault();
    const title = $("#mt").value.trim(), date = $("#md").value;
    if (!title || !date) return toast("Add a title and a date.");
    const {error} = await sb.from("memories").insert({title, occurred_on: date, note: $("#mn").value.trim() || null});
    if (error) return toast("Could not save: " + error.message);
    $("#mt").value = ""; $("#mn").value = ""; toast("Memory saved"); loadMems();
  });
}
function paintMems() {
  const el = $("#list"); if (!el || S.tab !== "memories") return;
  if (!S.mems.length) { el.innerHTML = `<div class="empty"><b>No memories yet</b>Keep the moments that matter: a first meeting, a trip, a decision.</div>`; return; }
  el.innerHTML = S.mems.map(m => `
    <div class="row"><div class="g"><div class="b">${esc(m.title)}</div>
      <div class="m">${esc(new Date(m.occurred_on + "T00:00:00").toLocaleDateString([], {day: "numeric", month: "long", year: "numeric"}))}</div>
      ${m.note ? `<div class="m">${esc(m.note)}</div>` : ""}</div>
      <button class="chip" data-act="mdel" data-id="${esc(m.id)}" aria-label="Delete memory">✕</button></div>`).join("");
}
async function delMem(id) {
  if (!confirm("Delete this memory?")) return;
  const {error} = await sb.from("memories").delete().eq("id", id);
  if (error) return toast(error.message);
  S.mems = S.mems.filter(x => x.id !== id); paintMems();
}

/* ---------- SETTINGS ---------- */
function viewMe() {
  const me = S.me;
  const tg = (k, label, sub) => `<div class="row"><div class="g"><div class="b">${label}</div><div class="m">${sub}</div></div>
    <button class="tg ${me[k] ? "on" : ""}" role="switch" aria-checked="${!!me[k]}" aria-label="${label}" data-act="tog" data-k="${k}"></button></div>`;
  return `<div class="row" style="align-items:center">${avatarHtml(S.user.id, me.display_name, "lg")}
      <div class="g"><div class="b">Profile photo</div><div class="m">Shown to people you chat with.</div></div>
      <label class="chip" style="margin:0;cursor:pointer">Change<input id="avf" type="file" accept="image/*" hidden></label></div>
    <form class="form" id="pf" autocomplete="off">
      <label class="f" for="pn" style="margin:0">Your name</label><input id="pn" value="${esc(me.display_name)}">
      <label class="f" for="pa" style="margin:4px 0 0">About</label><input id="pa" value="${esc(me.about || "")}">
      <button class="btn" type="submit">Save profile</button></form>
    <h2>Treasure AI</h2>
    ${tg("ai_can_read_messages", "Let AI read my messages", "Off by default. Saved now and used when Treasure AI launches.")}
    ${tg("ai_can_read_vault", "Let AI search my Vault", "Off by default. Saved now and used when Treasure AI launches.")}
    <h2>Notifications</h2>
    <div class="row"><div class="g"><div class="b">Message sounds</div><div class="m">Beep and vibrate when a message arrives while TREASURE is open.</div></div>
    <button class="tg ${soundOn() ? "on" : ""}" role="switch" aria-checked="${soundOn()}" aria-label="Message sounds" data-act="sound"></button></div>
    <h2>Invite friends</h2>
    <div class="m" style="margin-bottom:8px">Send your link. When a friend opens it and signs up, a chat with you starts automatically.</div>
    <button class="btn" data-act="invite" style="margin-bottom:8px">Share my invite link</button>
    <h2>App</h2>
    <button class="btn o" id="installBtn" data-act="install" ${S.installEv ? "" : "hidden"} style="margin-bottom:8px">Install TREASURE on this phone</button>
    <div class="m" style="margin-bottom:12px">To add it to your home screen: open the browser menu (⋮) and choose Add to Home screen.</div>
    <div class="m" style="margin-bottom:12px">Signed in as ${esc(S.user.email || "")}</div>
    <button class="btn o" data-act="signout">Sign out</button>
    <p class="fine" style="margin-top:14px"><button type="button" data-act="legal" data-k="terms">Terms</button> · <button type="button" data-act="legal" data-k="privacy">Privacy Policy</button></p>
    <button class="btn o danger" data-act="delacct" style="margin-top:8px">Delete my account</button>`;
}
async function deleteAccount() {
  const t = prompt("This permanently deletes your account, messages, Vault and Memories. Type DELETE to confirm.");
  if (t !== "DELETE") return;
  try {
    const {data: files} = await sb.storage.from("vault").list(S.user.id, {limit: 1000});
    if (files && files.length) await sb.storage.from("vault").remove(files.map(f => S.user.id + "/" + f.name));
  } catch (e) {}
  const {error} = await sb.rpc("delete_my_account");
  if (error) return toast("Could not delete: " + error.message + " (run the delete_my_account SQL first)");
  await signOut();
  toast("Your account was deleted.");
}
function bindMe() {
  const af = $("#avf"); if (af) af.addEventListener("change", e => { const f = e.target.files[0]; if (f) setAvatar(f); });
  $("#pf").addEventListener("submit", async ev => {
    ev.preventDefault();
    const name = $("#pn").value.trim(); if (!name) return toast("Your name cannot be empty.");
    const {data, error} = await sb.from("profiles").update({display_name: name, about: $("#pa").value.trim()}).eq("id", S.user.id).select().single();
    if (error) return toast(error.message);
    S.me = data; S.names[S.user.id] = data.display_name; toast("Profile saved");
  });
}
async function toggleSetting(k) {
  const val = !S.me[k];
  const {data, error} = await sb.from("profiles").update({[k]: val}).eq("id", S.user.id).select().single();
  if (error) return toast(error.message);
  S.me = data; const main = $("#main"); if (main) { main.innerHTML = viewMe(); bindMe(); }
}

/* ---------- SHELL ---------- */
const TABS = [["chats", "Chats"], ["vault", "Vault"], ["memories", "Memories"], ["me", "Me"]];
function render() {
  if (!S.user) return renderAuth("in");
  if (S.open) return renderChat();
  const title = S.tab === "chats" ? `<span class="brand">TREASURE</span>` : esc((TABS.find(t => t[0] === S.tab) || [])[1] || "");
  const view = {chats: `<input class="search" id="cq" type="search" placeholder="Search chats" aria-label="Search chats" value="${esc(S.q)}"><div id="list"></div><button class="fab" data-act="newchat" aria-label="New chat">+</button>`, vault: viewVault(), memories: viewMems(), me: viewMe()}[S.tab];
  root.innerHTML = `<div class="app">
    <div class="top"><h1>${title}</h1></div>
    <div class="main" id="main">${view}</div>
    <nav class="nav" aria-label="Main">${TABS.map(t => `<button class="${S.tab === t[0] ? "on" : ""}" data-act="tab" data-t="${t[0]}" ${t[0] === "chats" ? 'id="chatsTab"' : ""}>${t[1]}</button>`).join("")}</nav>
  </div>`;
  updateBadge();
  if (S.tab === "chats") paintConvs();
  if (S.tab === "vault") { bindVault(); paintVault(); loadVault(); }
  if (S.tab === "memories") { bindMems(); paintMems(); loadMems(); }
  if (S.tab === "me") bindMe();
}

/* ---------- EVENTS ---------- */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const d = el.dataset;
  if (d.act === "sheetbg" && e.target !== el) return;
  switch (d.act) {
    case "authmode": return renderAuth(d.mode);
    case "tab": S.tab = d.t; return render();
    case "open": return openConv(d.id);
    case "back": stopRec(true); S.open = null; S.msgQ = null; render(); return refreshConvs();
    case "legal": return openLegal(d.k);
    case "legalclose": case "legalbg": if (d.act === "legalbg" && e.target !== el) return; return closeLegal();
    case "delmsg": return deleteMsg(d.id);
    case "msgsearch": return toggleMsgSearch();
    case "sound": try { localStorage.setItem("tr_sound", soundOn() ? "off" : "on"); } catch (er) {} { const m = $("#main"); if (m) { m.innerHTML = viewMe(); bindMe(); } } return;
    case "delacct": return deleteAccount();
    case "mic": return startRec();
    case "recsend": return stopRec(false);
    case "reccancel": return stopRec(true);
    case "invite": return shareInvite();
    case "savemsg": return saveMsgToVault(d.id);
    case "newchat": return openSheet();
    case "sheetclose": case "sheetbg": return closeSheet();
    case "sheetmode": S.sheet.mode = d.mode; S.sheet.picked = new Set(); return paintSheet();
    case "startdm": return startDm(d.id);
    case "pick": S.sheet.picked.has(d.id) ? S.sheet.picked.delete(d.id) : S.sheet.picked.add(d.id); return paintSheetList();
    case "makegroup": return makeGroup();
    case "vcat": S.vcat = d.c; return paintVault();
    case "vfav": case "vlock": case "vdel": case "vopen": return vaultAct(d.act, d.id);
    case "mdel": return delMem(d.id);
    case "tog": return toggleSetting(d.k);
    case "install": if (S.installEv) { S.installEv.prompt(); S.installEv = null; el.hidden = true; } return;
    case "signout": return signOut();
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") { if ($("#legalbg")) closeLegal(); else if (S.sheet) closeSheet(); } });
document.addEventListener("input", e => {
  if (e.target.id === "cq") { S.q = e.target.value; paintConvs(); }
  else if (e.target.id === "msq") { S.msgQ = e.target.value; paintMsgs(); }
});

/* ---------- START ---------- */
(async function boot() {
  try {
    const {data: {session}} = await sb.auth.getSession();
    if (RECOVERY && session) { S.user = session.user; return renderReset(); }
    if (RECOVERY) return renderAuth("in", "That reset link has expired. Tap Forgot password to get a new one.");
    if (session) await enter(session.user); else renderAuth(pendingAdd() ? "up" : "in");
  } catch (e) { renderAuth("in", "Could not reach TREASURE. Check your connection and reload."); }
})();
</script>
</body>
</html>
